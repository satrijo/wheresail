<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhereSail — Coming soon</title>
<meta name="description" content="WhereSail — a free sailing weather map. Find your weather window. Coming soon.">
<link rel="icon" href="assets/favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #faf7f1;
    color: #014169;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
    padding: 3rem 2rem;
  }
  .arcs {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: min(264px, 62vw);
    height: auto;
    display: block;
  }
  .badge {
    margin-top: 3rem;
    display: inline-block;
    background: #014169;
    color: #ffffff;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    padding: 0.65rem 1.4rem;
    border-radius: 999px;
  }
  .badge i {
    font-style: normal;
    color: #03acb4;
  }
  p {
    margin-top: 1.75rem;
    font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    font-weight: 300;
    line-height: 1.8;
    letter-spacing: 0.02em;
    color: rgba(1, 65, 105, 0.62);
    max-width: 24rem;
  }
  footer {
    position: absolute;
    bottom: 2.25rem;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    text-transform: uppercase;
    color: rgba(1, 65, 105, 0.38);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo { animation: rise 1s ease both; }
  .badge { animation: rise 1s ease 0.15s both; }
  p { animation: rise 1s ease 0.3s both; }
  footer { animation: rise 1s ease 0.45s both; }
  @media (prefers-reduced-motion: reduce) {
    .logo, .badge, p, footer { animation: none; }
  }
</style>
</head>
<body>
  <svg class="arcs" viewBox="0 0 100 100" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <g fill="none" stroke="#014169" stroke-width="0.22">
      <circle cx="50" cy="-18" r="52" opacity="0.07"/>
      <circle cx="50" cy="-18" r="62" opacity="0.05"/>
      <circle cx="50" cy="-18" r="72" opacity="0.04"/>
      <circle cx="50" cy="-18" r="82" opacity="0.03"/>
    </g>
    <g fill="none" stroke="#03acb4" stroke-width="0.22">
      <circle cx="50" cy="-18" r="57" opacity="0.10"/>
      <circle cx="50" cy="-18" r="67" opacity="0.07"/>
    </g>
  </svg>
  <main>
    <img class="logo" src="assets/logo-primary.svg" alt="WhereSail — Find your weather window">
    <span class="badge">Coming soon <i>&bull;</i></span>
    <p>A free sailing weather map.<br>We&rsquo;re charting the course &mdash; check back soon.</p>
  </main>
  <footer>&copy; 2026 WhereSail</footer>
</body>
</html>
