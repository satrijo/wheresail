<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhereSail — Coming soon</title>
<meta name="description" content="WhereSail — a free sailing weather map. Find your weather window. Coming soon.">
<link rel="icon" href="assets/favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #014169;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
    padding: 2rem 1.5rem;
  }
  .arcs {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
  }
  .logo {
    width: min(300px, 64vw);
    height: auto;
    display: block;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .rule {
    width: 64px;
    height: 2px;
    background: #03acb4;
    border: 0;
  }
  p {
    font-size: clamp(1rem, 2.6vw, 1.15rem);
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.78);
    max-width: 26rem;
  }
  footer {
    position: absolute;
    bottom: 1.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.5);
  }
</style>
</head>
<body>
  <svg class="arcs" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g fill="none" stroke="#03acb4" stroke-width="0.25">
      <circle cx="50" cy="118" r="52" opacity="0.28"/>
      <circle cx="50" cy="118" r="62" opacity="0.20"/>
      <circle cx="50" cy="118" r="72" opacity="0.14"/>
      <circle cx="50" cy="118" r="82" opacity="0.10"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="0.2">
      <circle cx="50" cy="118" r="57" opacity="0.12"/>
      <circle cx="50" cy="118" r="67" opacity="0.08"/>
      <circle cx="50" cy="118" r="77" opacity="0.06"/>
    </g>
  </svg>
  <main>
    <img class="logo" src="assets/logo-white.svg" alt="WhereSail — Find your weather window">
    <h1>Coming soon</h1>
    <hr class="rule">
    <p>A free sailing weather map. We&rsquo;re charting the course &mdash; check back soon.</p>
  </main>
  <footer>&copy; 2026 WhereSail</footer>
</body>
</html>
